agent:
  name: pfg-small
  seed: 42
  log_level: INFO

graph:
  node_dim: 32
  max_nodes: 128
  max_edges: 4096
  basis_order: 5
  top_k_edges: 8
  activation: tanh
  use_layer_norm: true
  step_size: 0.5

learning:
  lr: 0.01
  salience_decay: 0.999
  edge_add_threshold: 0.7
  edge_remove_threshold: 0.05
  min_edge_age_for_removal: 100

memory:
  sqlite_path: data/pfg.sqlite
  max_facts: 100000
  max_episodes: 10000
  retrieval_top_k: 8
  recency_lambda: 0.0001
  w_importance: 0.2
  w_recency: 0.1
  w_usage: 0.05

planner:
  simulation_horizon: 5
  max_actions: 16
  reward_weight: 1.0
  risk_weight: 1.0
  cost_weight: 0.3
  tie_tolerance: 0.05

executor:
  allow_network: false
  allow_shell: false
  allow_money: false
  allowed_dirs:
    - sandbox
  require_human_approval_for:
    - money
    - network
    - shell
  skill_timeout_s: 5
  skill_max_mem_mb: 128

skills:
  dir: skills
  max_code_size_kb: 64
  allowed_imports:
    - math
    - json
    - re
    - datetime
    - typing
  max_skill_error: 0.05

benchmark:
  tasks:
    - sequence_prediction
    - memory_recall
    - arithmetic
    - file_tool
    - gridworld_small

logging:
  dir: logs

daemon:
  poll_timeout_s: 2.0
  idle_before_autonomous_s: 30
  autonomous_interval_s: 900
  sleep_interval_s: 21600
  autosave_interval_s: 300
  inbox_scan_interval_s: 5

motivation:
  w_curiosity: 0.4
  w_need: 0.35
  w_profit: 0.25
  min_priority: 0.15
  disk_free_min_gb: 0.5
  max_db_mb: 200

# Внешний контур данных. ПО УМОЛЧАНИЮ ВЫКЛЮЧЕН.
# Данные из интернета пополняют ПАМЯТЬ (факты), а не архитектуру графа.
network:
  enabled: true
  deny_by_default: true
  allowed_domains:
    - ru.wikipedia.org
    - en.wikipedia.org
  max_bytes_per_request: 60000
  max_total_bytes_per_day: 5000000
  max_requests_per_hour: 30
  timeout_seconds: 15
  respect_robots_txt: true
  cache_min_age_s: 900
  max_facts_per_ingest: 15
  min_facts_per_ingest: 1

trust:
  w_reputation: 0.30
  w_corroboration: 0.25
  w_freshness: 0.25
  w_conflict: 0.30
  w_suspicion: 0.40
  freshness_lambda: 0.00001
  min_trust_for_low_risk: 0.2
  min_trust_for_fact_confidence: 0.5
  conflict_penalty: 0.3
  suspicion_penalty: 0.4

curiosity:
  gap_threshold: 0.4
  max_goals_per_cycle: 3
  cost_weight: 0.5
  lambda_bytes: 0.00001
  lambda_latency: 0.01
  parse_difficulty: 0.3
  stale_after_s: 86400
